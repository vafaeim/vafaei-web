<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Set Password</title>
        <link rel="stylesheet"
              href="{{ url_for('static', filename='css/set_username.css') }}">
        <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='assets/favicon.svg') }}">
        <meta name="theme-color" content="#0f1724">
    </head>
    <body>
        <div class="card">
            <h2>🔒 Set Password</h2>
            <p>You can set a password for faster login (optional)</p>
            <input type="password"
                   id="passwordInput"
                   placeholder="Password (min 6 characters)">
            <input type="password"
                   id="confirmPasswordInput"
                   placeholder="Confirm password">
            <button class="btn" id="submitPasswordBtn" onclick="submitPassword()">Save & Continue</button>
            <button class="btn btn-skip" onclick="skipPassword()">I'll set it up later</button>
            <div id="msg" class="error"></div>
        </div>
        <script src="{{ url_for('static', filename='js/set_username.js') }}" defer></script>
    </body>
</html>
