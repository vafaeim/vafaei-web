<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>amirrrr · home</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg: #0a0a0f;
      --card-bg: rgba(15, 15, 25, 0.7);
      --card-border: rgba(255, 255, 255, 0.06);
      --text: #eaeaea;
      --text-secondary: #8a8a9a;
      --accent: #6c5ce7;
      --accent-secondary: #a78bfa;
      --link-hover-bg: rgba(108, 92, 231, 0.08);
      --link-hover-border: rgba(108, 92, 231, 0.4);
      --tag-bg: rgba(255, 255, 255, 0.04);
      --tag-text: #aaa;
      --game-bg: #0f0f1a;
      --game-border: rgba(255,255,255,0.06);
      --bird-color: #f0f0f0;
      --pipe-color: #6c5ce7;
      --particle-color: rgba(108, 92, 231, 0.4);
      --footer-color: #555;
      --toggle-color: #ccc;
      --scroll-indicator: #6c5ce7;
    }
    body.light-mode {
      --bg: #f0f2f5;
      --card-bg: rgba(255, 255, 255, 0.8);
      --card-border: rgba(0, 0, 0, 0.06);
      --text: #1a1a2e;
      --text-secondary: #4a4a5a;
      --accent: #6c5ce7;
      --accent-secondary: #a78bfa;
      --link-hover-bg: rgba(108, 92, 231, 0.06);
      --link-hover-border: rgba(108, 92, 231, 0.5);
      --tag-bg: rgba(0, 0, 0, 0.04);
      --tag-text: #555;
      --game-bg: #e8eaed;
      --game-border: rgba(0,0,0,0.08);
      --bird-color: #1a1a2e;
      --pipe-color: #6c5ce7;
      --particle-color: rgba(108, 92, 231, 0.15);
      --footer-color: #888;
      --toggle-color: #333;
      --scroll-indicator: #6c5ce7;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
      position: relative;
      transition: background 0.5s, color 0.3s;
      color: var(--text);
      scroll-behavior: smooth;
    }

    #particles {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .page {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1.5rem 4rem;
      min-height: 100vh;
      justify-content: center;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 2.5rem;
      padding: 3rem 2rem;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      transition: background 0.4s, border-color 0.4s, box-shadow 0.4s;
      position: relative;
      margin-bottom: 4rem;
    }

    .theme-toggle {
      position: absolute;
      top: 1.2rem; left: 1.2rem;
      background: none;
      border: 1px solid transparent;
      color: var(--toggle-color);
      font-size: 1.3rem;
      cursor: pointer;
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      transition: all 0.3s;
    }
    .theme-toggle:hover {
      border-color: var(--card-border);
      background: var(--link-hover-bg);
    }

    .status-dot {
      position: absolute;
      top: 1.4rem; right: 1.4rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.7rem;
      color: var(--text-secondary);
    }
    .status-dot .pulse {
      width: 8px; height: 8px;
      background: #34d399;
      border-radius: 50%;
      animation: pulse-dot 2s infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.4); }
    }

    .rule {
      width: 40px; height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent-secondary));
      margin: 0 auto 2rem;
      border-radius: 1px;
    }

    .avatar-icon {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.8rem;
      font-size: 2rem;
      color: #fff;
      box-shadow: 0 10px 25px rgba(108, 92, 231, 0.3);
    }

    h1 {
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 2rem;
      font-weight: 400;
      background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3, #ff6b6b);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: titleShimmer 4s ease-in-out infinite alternate;
      margin-bottom: 2.5rem;
      letter-spacing: 0.1em;
    }
    @keyframes titleShimmer {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 1.8rem;
    }
    .link-card {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.2rem;
      border: 1px solid var(--card-border);
      border-radius: 1.2rem;
      cursor: pointer;
      transition: all 0.3s;
      text-align: left;
      background: transparent;
      text-decoration: none;
      color: inherit;
    }
    .link-card:hover {
      background: var(--link-hover-bg);
      border-color: var(--link-hover-border);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }
    .link-card i {
      font-size: 1.5rem;
      color: var(--accent);
      width: 2.2rem;
      text-align: center;
    }
    .link-info {
      display: flex;
      flex-direction: column;
    }
    .link-title {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text);
    }
    .link-sub {
      font-size: 0.7rem;
      color: var(--text-secondary);
      margin-top: 0.15rem;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-top: 0.5rem;
    }
    .social-links a {
      font-size: 1.8rem;
      color: var(--text-secondary);
      transition: all 0.3s;
      opacity: 0.4;
      text-decoration: none;
    }
    .social-links a:hover {
      opacity: 0.9;
      color: var(--accent);
      transform: translateY(-2px);
    }

    .scroll-indicator {
      margin-top: 1.5rem;
      color: var(--scroll-indicator);
      animation: bounce 1.8s infinite;
      font-size: 1.2rem;
      opacity: 0.7;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(10px); }
    }

    .footer-text {
      font-size: 0.65rem;
      color: var(--footer-color);
      margin-top: 0.8rem;
      letter-spacing: 0.1em;
    }

    .game-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 400px;
    }
    .game-prompt {
      color: var(--text-secondary);
      font-size: 0.75rem;
      margin-bottom: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    canvas#flappyCanvas {
      display: block;
      border: 1px solid var(--game-border);
      border-radius: 1.2rem;
      background: var(--game-bg);
      box-shadow: 0 15px 40px rgba(0,0,0,0.15);
      transition: background 0.4s, border-color 0.4s;
      max-width: 100%;
      height: auto;
    }
    .reset-btn {
      margin-top: 1rem;
      background: var(--tag-bg);
      border: 1px solid var(--card-border);
      color: var(--text-secondary);
      font-size: 0.8rem;
      padding: 0.5rem 1.5rem;
      border-radius: 2rem;
      cursor: pointer;
      transition: all 0.3s;
      display: none;
      font-family: inherit;
    }
    .reset-btn.show { display: inline-block; }
    .reset-btn:hover {
      border-color: var(--link-hover-border);
      color: var(--text);
      background: var(--link-hover-bg);
    }
  </style>
</head>
<body>
  <canvas id="particles"></canvas>
  <div class="page">
    <div class="card">
      <button class="theme-toggle" onclick="toggleTheme()" title="switch theme">◑</button>
      <div class="status-dot" id="statusDot">
        <span class="pulse"></span> live
      </div>

      <div class="rule"></div>
      <div class="avatar-icon">✦</div>
      <h1>amirrrr</h1>

      <div class="links">
        <a href="/chat" class="link-card">
          <i class="fa-solid fa-comments"></i>
          <div class="link-info">
            <span class="link-title">Messenger</span>
            <span class="link-sub">Secure real‑time chat with media & voice</span>
          </div>
        </a>
        <a href="/whisper/" class="link-card">
          <i class="fa-solid fa-ghost"></i>
          <div class="link-info">
            <span class="link-title">Whisper</span>
            <span class="link-sub">Send truly anonymous messages</span>
          </div>
        </a>
        <a href="/douz/" class="link-card">
          <i class="fa-solid fa-gamepad"></i>
          <div class="link-info">
            <span class="link-title">Tic‑Tac‑Toe</span>
            <span class="link-sub">Play a quick game with friends</span>
          </div>
        </a>
      </div>

      <div class="social-links">
        <a href="https://github.com/vafaeim" target="_blank" title="GitHub"><i class="fab fa-github"></i></a>
        <a href="https://kaggle.com/vafaeii" target="_blank" title="Kaggle"><i class="fab fa-kaggle"></i></a>
        <a href="https://t.me/amirvafaeim" target="_blank" title="Telegram"><i class="fab fa-telegram"></i></a>
      </div>

      <div class="scroll-indicator">
        <i class="fa-solid fa-chevron-down"></i>
      </div>
      <div class="footer-text">— play a little —</div>
    </div>

    <div class="game-section">
      <p class="game-prompt">
        <i class="fa-solid fa-arrow-up"></i> press space or tap to fly
      </p>
      <canvas id="flappyCanvas" width="360" height="480"></canvas>
      <button id="resetButton" class="reset-btn">↻ retry</button>
    </div>
  </div>

  <script>
    const body = document.body;
    const themeToggleBtn = document.querySelector('.theme-toggle');
    function setTheme(isLight) {
      body.classList.toggle('light-mode', isLight);
      themeToggleBtn.textContent = isLight ? '◐' : '◑';
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
    }
    function toggleTheme() { setTheme(!body.classList.contains('light-mode')); }
    setTheme(localStorage.getItem('theme') === 'light');

    const canvasP = document.getElementById('particles');
    const ctxP = canvasP.getContext('2d');
    let width, height;
    const particles = [];
    const PARTICLE_COUNT = 70;
    const MOUSE_RADIUS = 100;

    const mouse = { x: -1000, y: -1000 };
    window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        mouse.x = e.touches[0].clientX;
        mouse.y = e.touches[0].clientY;
      }
    }, { passive: true });

    function resizeParticles() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvasP.width = width;
      canvasP.height = height;
    }
    window.addEventListener('resize', resizeParticles);
    resizeParticles();

    class Particle {
      constructor() {
        this.reset();
        this.y = Math.random() * height;
      }
      reset() {
        this.x = Math.random() * width;
        this.y = -10;
        this.size = Math.random() * 2 + 0.8;
        this.speedY = Math.random() * 0.6 + 0.2;
        this.speedX = (Math.random() - 0.5) * 0.3;
        this.opacity = Math.random() * 0.6 + 0.2;
      }
      update() {
        this.y += this.speedY;
        this.x += this.speedX;

        const dx = this.x - mouse.x;
        const dy = this.y - mouse.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < MOUSE_RADIUS) {
          const angle = Math.atan2(dy, dx);
          const force = (MOUSE_RADIUS - dist) / MOUSE_RADIUS;
          this.x += Math.cos(angle) * force * 1.5;
          this.y += Math.sin(angle) * force * 1.5;
        }

        if (this.y > height + 10) this.reset();
        if (this.x < -10) this.x = width + 10;
        if (this.x > width + 10) this.x = -10;
      }
      draw() {
        ctxP.beginPath();
        ctxP.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctxP.fillStyle = `rgba(108, 92, 231, ${this.opacity})`;
        ctxP.fill();
      }
    }

    for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(new Particle());

    function animateParticles() {
      ctxP.clearRect(0, 0, width, height);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    fetch('/').then(r => {
      if (r.ok) document.getElementById('statusDot').innerHTML = '<span class="pulse"></span> live';
      else document.getElementById('statusDot').innerHTML = '<span style="color:#ff4d4d">●</span> offline';
    }).catch(() => {
      document.getElementById('statusDot').innerHTML = '<span style="color:#ff4d4d">●</span> offline';
    });

    const canvas = document.getElementById('flappyCanvas');
    const ctx = canvas.getContext('2d');
    const resetBtn = document.getElementById('resetButton');

    function getStyleVar(name) {
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    const bird = { x: 60, y: canvas.height / 2, r: 9, gravity: 0.45, lift: -7.5, vel: 0 };
    let pipes = [];
    const PW = 22, GAP = 115;
    let frame = 0, score = 0, best = parseInt(localStorage.getItem('flappyBest') || '0');
    let started = false, over = false;
    let animId;

    function resetGame() {
      bird.y = canvas.height / 2;
      bird.vel = 0;
      pipes = [];
      frame = 0;
      score = 0;
      over = false;
      started = true;
      resetBtn.classList.remove('show');
    }

    function drawBird() {
      ctx.save();
      ctx.translate(bird.x, bird.y);
      ctx.shadowColor = getStyleVar('--accent');
      ctx.shadowBlur = 14;
      ctx.fillStyle = getStyleVar('--bird-color');
      ctx.beginPath();
      ctx.arc(0, 0, bird.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(2, -2, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(3, -2, 1.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawPipes() {
      ctx.fillStyle = getStyleVar('--pipe-color');
      ctx.shadowColor = getStyleVar('--accent');
      ctx.shadowBlur = 6;
      for (let p of pipes) {
        ctx.fillRect(p.x, 0, PW, p.top);
        ctx.fillRect(p.x, p.top + GAP, PW, canvas.height - p.top - GAP);
        ctx.fillRect(p.x - 3, p.top - 12, PW + 6, 12);
        ctx.fillRect(p.x - 3, p.top + GAP, PW + 6, 12);
      }
      ctx.shadowBlur = 0;
    }

    function updatePipes() {
      if (frame % 85 === 0) {
        let top = Math.random() * (canvas.height - GAP - 70) + 40;
        pipes.push({ x: canvas.width, top, scored: false });
      }
      for (let p of pipes) p.x -= 2.2;
      pipes = pipes.filter(p => p.x > -PW);
    }

    function checkCollision() {
      for (let p of pipes) {
        if (bird.x + bird.r > p.x && bird.x - bird.r < p.x + PW) {
          if (bird.y - bird.r < p.top || bird.y + bird.r > p.top + GAP) return true;
        }
      }
      return bird.y + bird.r > canvas.height || bird.y - bird.r < 0;
    }

    function updateScore() {
      for (let p of pipes) {
        if (!p.scored && p.x + PW < bird.x) {
          score++;
          p.scored = true;
          if (score > best) {
            best = score;
            localStorage.setItem('flappyBest', best);
          }
        }
      }
    }

    function drawHUD() {
      ctx.fillStyle = getStyleVar('--text-secondary');
      ctx.font = 'bold 16px "Segoe UI"';
      ctx.textAlign = 'left';
      ctx.fillText(score, 15, 35);
      ctx.font = '12px "Segoe UI"';
      ctx.textAlign = 'right';
      ctx.fillText('best: ' + best, canvas.width - 15, 30);
    }

    function drawIdle() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      let bob = Math.sin(Date.now() * 0.008) * 5;
      ctx.save();
      ctx.translate(bird.x, bird.y + bob);
      ctx.shadowColor = getStyleVar('--accent');
      ctx.shadowBlur = 10;
      ctx.fillStyle = getStyleVar('--bird-color');
      ctx.beginPath();
      ctx.arc(0, 0, bird.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.fillStyle = getStyleVar('--text-secondary');
      ctx.font = '16px "Segoe UI"';
      ctx.textAlign = 'center';
      ctx.fillText('tap or press space', canvas.width / 2, canvas.height / 2 + 20);
      ctx.font = '12px "Segoe UI"';
      ctx.fillText('best: ' + best, canvas.width / 2, canvas.height / 2 + 45);
    }

    function drawGameOver() {
      ctx.fillStyle = getStyleVar('--text-secondary');
      ctx.textAlign = 'center';
      let cy = canvas.height / 2 - 30;
      ctx.font = '24px "Georgia"';
      ctx.fillText('game over', canvas.width / 2, cy);
      cy += 35;
      ctx.font = '16px "Segoe UI"';
      ctx.fillText('score: ' + score, canvas.width / 2, cy);
      cy += 25;
      ctx.fillText('best: ' + best, canvas.width / 2, cy);
    }

    function gameLoop() {
      if (!started && !over) {
        drawIdle();
        animId = requestAnimationFrame(gameLoop);
        return;
      }
      if (over) {
        animId = requestAnimationFrame(gameLoop);
        return;
      }
      bird.vel += bird.gravity;
      bird.y += bird.vel;
      updatePipes();
      updateScore();

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawPipes();
      drawBird();
      drawHUD();

      if (checkCollision()) {
        over = true;
        started = false;
        drawGameOver();
        resetBtn.classList.add('show');
      }
      frame++;
      animId = requestAnimationFrame(gameLoop);
    }

    function jump() {
      if (over) return;
      if (!started) { resetGame(); }
      else { bird.vel = bird.lift; }
    }

    document.addEventListener('keydown', function(e) {
      if (e.code === 'Space') {
        if (document.activeElement?.tagName === 'BUTTON' || document.activeElement?.tagName === 'INPUT') return;
        e.preventDefault();
        jump();
      }
    });
    canvas.addEventListener('click', jump);
    resetBtn.addEventListener('click', () => { if (over) resetGame(); });
    animId = requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
