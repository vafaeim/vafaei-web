<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
        <title>whisper · anonymous</title>
        <link rel="stylesheet"
              href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <link rel="stylesheet"
              href="{{ url_for('static', filename='css/whisper.css') }}">
    </head>
    <body>
        <div class="phone-frame">
            <!-- Header -->
            <div class="status-bar">
                <div class="title-group">
                    <div class="status-icon">
                        <i class="fa-solid fa-ghost"></i>
                    </div>
                    <div>
                        <div class="title">whisper</div>
                        <div class="subtitle">completely anonymous</div>
                    </div>
                </div>
                <button class="theme-toggle" onclick="toggleTheme()" title="switch theme">◑</button>
            </div>
            <!-- Messages -->
            <div class="messages" id="messagesContainer"></div>
            <!-- Attachment preview -->
            <div class="preview-area" id="previewArea">
                <div class="file-icon" id="previewIcon">
                    <i class="fa-solid fa-file"></i>
                </div>
                <span id="previewText" style="flex:1;"></span>
                <button class="remove-preview" onclick="removeAttachment()">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <!-- Emoji panel -->
            <div class="emoji-panel" id="emojiPanel">
                <button class="emoji-btn" onclick="sendEmoji('👍')">👍</button>
                <button class="emoji-btn" onclick="sendEmoji('❤️')">❤️</button>
                <button class="emoji-btn" onclick="sendEmoji('😂')">😂</button>
                <button class="emoji-btn" onclick="sendEmoji('😢')">😢</button>
                <button class="emoji-btn" onclick="sendEmoji('😡')">😡</button>
                <button class="emoji-btn" onclick="sendEmoji('👋')">👋</button>
            </div>
            <!-- Input bar -->
            <div class="input-bar">
                <button class="icon-btn" id="emojiToggleBtn" onclick="toggleEmojiPanel()">
                    <i class="fa-solid fa-face-smile"></i>
                </button>
                <label for="imageInput" class="icon-btn">
                    <i class="fa-solid fa-paperclip"></i>
                </label>
                <input type="file"
                       id="imageInput"
                       accept="image/*"
                       onchange="handlePhotoSelect(this)">
                <button class="icon-btn" id="voiceBtn" onclick="toggleRecording()">
                    <i class="fa-solid fa-microphone"></i>
                </button>
                <textarea class="text-input"
                          id="messageInput"
                          placeholder="Type a message..."
                          dir="auto"
                          rows="1"
                          oninput="toggleSendButton()"></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                    <i class="fa-solid fa-arrow-up send-icon"></i>
                    <div class="send-spinner" id="sendSpinner"></div>
                </button>
            </div>
        </div>
        <script src="{{ url_for('static', filename='js/whisper.js') }}" defer></script>
    </body>
</html>
