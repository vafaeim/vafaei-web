<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <title>amirrrr · home</title>
        <link rel="stylesheet"
              href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <link rel="stylesheet"
              href="{{ url_for('static', filename='css/main.css') }}">
        <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='assets/favicon.svg') }}">
        <meta name="theme-color" content="#0f1724">
    </head>
    <body>
        <canvas id="particles"></canvas>
        <div class="page">
            <div class="card">
                <button class="theme-toggle" onclick="toggleTheme()" title="switch theme">◑</button>
                <div class="status-dot" id="statusDot">
                    <span class="pulse"></span> live
                </div>
                <div class="rule"></div>
                <div class="avatar-icon">✦</div>
                <h1>amirrrr</h1>
                <div class="links">
                    <a href="/chat" class="link-card">
                        <i class="fa-solid fa-comments"></i>
                        <div class="link-info">
                            <span class="link-title">Messenger</span>
                            <span class="link-sub">Secure real‑time chat with media & voice</span>
                        </div>
                    </a>
                    <a href="/paste" class="link-card">
                        <i class="fa-solid fa-code"></i>
                        <div class="link-info">
                            <span class="link-title">Pastebin</span>
                            <span class="link-sub">Highlighted markdown snippets</span>
                        </div>
                    </a>
                    <a href="/whisper/" class="link-card">
                        <i class="fa-solid fa-ghost"></i>
                        <div class="link-info">
                            <span class="link-title">Whisper</span>
                            <span class="link-sub">Send truly anonymous messages</span>
                        </div>
                    </a>
                    <a href="/douz/" class="link-card">
                        <i class="fa-solid fa-gamepad"></i>
                        <div class="link-info">
                            <span class="link-title">Tic‑Tac‑Toe</span>
                            <span class="link-sub">Play a quick game with friends</span>
                        </div>
                    </a>
                </div>
                <div class="social-links">
                    <a href="https://github.com/vafaeim" target="_blank" title="GitHub"><i class="fab fa-github"></i></a>
                    <a href="https://kaggle.com/vafaeii" target="_blank" title="Kaggle"><i class="fab fa-kaggle"></i></a>
                    <a href="https://t.me/amirvafaeim" target="_blank" title="Telegram"><i class="fab fa-telegram"></i></a>
                </div>
                <div class="scroll-indicator">
                    <i class="fa-solid fa-chevron-down"></i>
                </div>
                <div class="footer-text">— play a little —</div>
            </div>
            <div class="game-section">
                <p class="game-prompt">
                    <i class="fa-solid fa-arrow-up"></i> press space or tap to fly
                </p>
                <canvas id="flappyCanvas" width="360" height="480"></canvas>
                <button id="resetButton" class="reset-btn">↻ retry</button>
            </div>
        </div>
        <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
    </body>
</html>
