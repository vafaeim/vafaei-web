<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Vazirmatn', Tahoma, sans-serif;
      background: #17212b;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .card {
      background: #0e1621;
      padding: 2rem;
      border-radius: 1.5rem;
      text-align: center;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .tab-container {
      display: flex;
      background: #212e3c;
      border-radius: 1rem;
      margin-bottom: 1.5rem;
      overflow: hidden;
      gap: 0;
    }
    .tab {
      flex: 1;
      padding: 0.6rem;
      font-size: 0.9rem;
      cursor: pointer;
      color: #8ea2b8;
      border-bottom: 2px solid transparent;
      transition: 0.2s;
      background: none;
      border: none;
      font-family: inherit;
    }
    .tab.active {
      color: #fff;
      border-bottom-color: #2b9cff;
    }
    h2 { margin-bottom: 0.25rem; font-size: 1.5rem; }
    .subtitle {
      font-size: 0.85rem;
      color: #aab2bb;
      margin-bottom: 1.5rem;
    }
    .form-group {
      margin: 1rem 0;
      display: none;
    }
    .form-group.active {
      display: block;
    }
    input {
      width: 100%;
      padding: 0.8rem;
      font-size: 1rem;
      background: #212e3c;
      border: 1px solid #2b3a4a;
      border-radius: 0.8rem;
      color: #fff;
      margin: 0.5rem 0;
      outline: none;
      font-family: inherit;
    }
    .btn {
      background: #2b5278;
      color: #fff;
      border: none;
      padding: 0.8rem 2rem;
      border-radius: 0.8rem;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 1rem;
      width: 100%;
      font-family: inherit;
    }
    .btn:hover { background: #3a6a99; }
    .error { color: #ff4d4d; margin-top: 1rem; font-size: 0.9rem; }
    .success { color: #34d399; margin-top: 1rem; font-size: 0.9rem; }
    .timer {
      font-size: 0.9rem;
      color: #ffb300;
      margin: 1rem 0;
    }
    .hidden { display: none; }
    .token-box {
    background: #212e3c;
    border-radius: 1rem;
    padding: 1rem;
    margin: 1rem 0;
    }
    .token {
    font-size: 1.8rem;
    font-weight: 700;
    letter-spacing: 0.3rem;
    color: #2b9cff;
    user-select: all;
    word-break: break-all;
    font-family: 'Courier New', monospace;
    margin-bottom: 0.5rem;
    }
    .copy-hint {
        font-size: 0.75rem;
        color: #8ea2b8;
        margin-top: 0.6rem;
    }
    .bot-box {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    background: #212e3c;
    border-radius: 1rem;
    padding: 0.8rem;
    margin: 1.2rem 0;
    text-decoration: none;
    color: #fff;
    transition: background 0.2s;
    }
    .bot-box:hover { background: #2b5278; }
    .bot-icon {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background-image: url('/static/assets/images/verifymebot.png');
    background-size: cover;
    background-position: center;
    }
    .bot-name {
    font-weight: 600;
    font-size: 1rem;
    }
    .bot-link {
    font-size: 0.75rem;
    color: #aab2bb;
    }
    .btn-secondary {
    background: transparent;
    color: #8ea2b8;
    border: 1px solid #2b3a4a;
    padding: 0.8rem 1.5rem;
    border-radius: 0.8rem;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.2s;
    font-family: inherit;
    margin-top: 0.5rem;
    }
    .btn-secondary:hover { background: #212e3c; }
    .status {
    margin: 1rem 0;
    min-height: 1.5rem;
    }
    .animate-pulse {
    animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
    0% { opacity: 1; }
    50% { opacity: 0.5; }
    100% { opacity: 1; }
    }
    .btn-loading {
        position: relative;
        pointer-events: none;
        opacity: 0.7;
    }
    .btn-spinner {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255,255,255,0.3);
        border-radius: 50%;
        border-top-color: #fff;
        animation: spin 0.6s linear infinite;
        margin-right: 6px;
        vertical-align: middle;
    }
    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    .copy-divider {
        height: 1px;
        background: rgba(255,255,255,0.08);
        margin: 0.6rem 0;
    }

    .copy-btn {
        background: transparent;
        color: #aab2bb;
        border: 1px solid #2b3a4a;
        padding: 0.4rem 0.8rem;
        border-radius: 0.5rem;
        cursor: pointer;
        font-size: 0.8rem;
        transition: background 0.2s, border-color 0.2s, color 0.2s, box-shadow 0.2s;
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        font-family: inherit;
    }

    .copy-btn:hover {
        background: rgba(255,255,255,0.03);
        border-color: rgba(255,255,255,0.2);
        color: #fff;
        box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .copy-btn:active {
        transform: scale(0.96);
    }

    .copy-btn.copied {
        background: #34d39922;
        border-color: #34d399;
        color: #34d399;
        pointer-events: none;
    }

    .copy-btn.copied i {
        color: #34d399;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="tab-container">
      <button class="tab active" id="tabOtp" onclick="switchTab('otp')">🤖 Login with Bot</button>
      <button class="tab" id="tabPass" onclick="switchTab('password')">🔑 Password</button>
    </div>

    <!-- OTP Form -->
    <div id="otpForm" class="form-group active">
      <h2>🔐 Secure Login</h2>
      <p class="subtitle">Verify with VerifyMeBot</p>
      <div class="token-box">
          <div class="token" id="otpCode">{{ code }}</div>
          <div class="copy-divider"></div>
          <button class="copy-btn" id="copyTokenBtn" onclick="copyToken()">
              <i class="fa-solid fa-copy"></i> <span>Copy</span>
          </button>
          <div class="copy-hint">Send this token to the bot</div>
      </div>
      <a class="bot-box" href="https://rubika.ir/verifymebot" target="_blank">
        <div class="bot-icon"></div>
        <div>
          <div class="bot-name">VerifyMeBot</div>
          <div class="bot-link">@verifymebot</div>
        </div>
      </a>
      <div class="timer" id="timer">
        <span>⏳</span> <span id="timerText">Time remaining: 1:30</span>
      </div>
      <div id="statusOtp" class="status"></div>
      <button class="btn-secondary" onclick="window.location.reload()">Get New Token</button>
    </div>

    <!-- Password Form -->
    <div id="passwordForm" class="form-group">
      <h2>🔑 Login with Password</h2>
      <input type="text" id="usernameInput" placeholder="Username">
      <input type="password" id="passwordInputLogin" placeholder="Password">
      <button class="btn" onclick="loginWithPassword()">Login</button>
      <div id="errorPass" class="error"></div>
    </div>
  </div>

  <script>
    let activeTab = 'otp';
    const code = "{{ code }}";
    const otpToken = "{{ otp_token }}";

    let timeLeft = 90;
    let expired = false;
    let checking = false;

    const timerEl = document.getElementById('timerText');
    const statusEl = document.getElementById('statusOtp');

    function updateTimer() {
      if (expired) return;
      timeLeft--;
      if (timeLeft <= 0) {
        expired = true;
        timerEl.textContent = 'Time is up';
        statusEl.innerHTML = '<div class="error">Code expired. Please get a new token.</div>';
        return;
      }
      const mins = Math.floor(timeLeft / 60);
      const secs = timeLeft % 60;
      timerEl.textContent = `Time remaining: ${mins}:${secs.toString().padStart(2, '0')}`;
    }
    setInterval(updateTimer, 1000);

    async function checkVerification() {
      if (expired || checking) return;
      checking = true;
      statusEl.innerHTML = '<div class="info animate-pulse">Checking...</div>';
      try {
        const resp = await fetch(`/api/verify_otp?code=${encodeURIComponent(code)}&otp_token=${encodeURIComponent(otpToken)}`);
        const data = await resp.json();
        if (data.success) {
          statusEl.innerHTML = '<div class="success">Verified! Redirecting...</div>';
          setTimeout(() => {
            window.location.href = data.new_user ? '/set-username' : '/chat';
          }, 800);
        } else {
          checking = false;
        }
      } catch (err) {
        checking = false;
      }
    }

    checkVerification();
    setInterval(() => {
      if (!expired && !checking) checkVerification();
    }, 2000);

    async function loginWithPassword() {
        const username = document.getElementById('usernameInput').value.trim();
        const password = document.getElementById('passwordInputLogin').value;
        const btn = document.querySelector('#passwordForm .btn');
        const errorEl = document.getElementById('errorPass');

        if (!username || !password) {
            errorEl.textContent = 'Please enter your username and password.';
            return;
        }

        const originalText = btn.textContent;
        btn.disabled = true;
        btn.classList.add('btn-loading');
        btn.innerHTML = '<span class="btn-spinner"></span> Login...';
        errorEl.textContent = '';

        try {
            const resp = await fetch('/api/login_password', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ username, password })
            });
            const data = await resp.json();

            if (data.success) {
                window.location.href = '/chat';
            } else {
                errorEl.textContent = data.error || 'Incorrect username or password.';
                btn.disabled = false;
                btn.classList.remove('btn-loading');
                btn.textContent = originalText;
            }
        } catch (err) {
            errorEl.textContent = 'Network error';
            btn.disabled = false;
            btn.classList.remove('btn-loading');
            btn.textContent = originalText;
        }
    }

    function switchTab(tab) {
      activeTab = tab;
      document.getElementById('tabOtp').classList.toggle('active', tab === 'otp');
      document.getElementById('tabPass').classList.toggle('active', tab === 'password');
      document.getElementById('otpForm').classList.toggle('active', tab === 'otp');
      document.getElementById('passwordForm').classList.toggle('active', tab === 'password');
    }

    function copyToken() {
        const token = document.getElementById('otpCode').textContent.trim();
        const btn = document.getElementById('copyTokenBtn');
        const icon = btn.querySelector('i');
        const span = btn.querySelector('span');

        navigator.clipboard.writeText(token).then(() => {
            icon.className = 'fa-solid fa-check';
            span.textContent = 'Copied!';
            btn.classList.add('copied');

            setTimeout(() => {
                icon.className = 'fa-solid fa-copy';
                span.textContent = 'Copy';
                btn.classList.remove('copied');
            }, 2000);
        }).catch(() => {
            showToast('Failed to copy token');
        });
    }
  </script>
</body>
</html>
