<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Set Password</title>
        <link rel="stylesheet"
              href="{{ url_for('static', filename='css/set_password.css') }}">
        <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='assets/favicon.svg') }}">
        <meta name="theme-color" content="#0f1724">
    </head>
    <body>
        <div class="card">
            <h2>🔒 تنظیم رمز عبور</h2>
            <p>می‌توانید برای ورود سریع‌تر رمز عبور تنظیم کنید (اختیاری)</p>
            <input type="password"
                   id="passwordInput"
                   placeholder="رمز عبور (حداقل ۶ کاراکتر)">
            <input type="password"
                   id="confirmPasswordInput"
                   placeholder="تکرار رمز عبور">
            <button class="btn" onclick="submitPassword()">ذخیره و ادامه</button>
            <button class="btn btn-skip" onclick="skipPassword()">بعداً تنظیم می‌کنم</button>
            <div id="msg" class="error"></div>
        </div>
        <script src="{{ url_for('static', filename='js/set_password.js') }}" defer></script>
    </body>
</html>
