<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set Password</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Vazirmatn', Tahoma, sans-serif;
      background: #17212b;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .card {
      background: #0e1621;
      padding: 2rem;
      border-radius: 1.5rem;
      text-align: center;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h2 { margin-bottom: 0.5rem; }
    p { color: #aab2bb; font-size: 0.9rem; margin-bottom: 1.5rem; }
    input {
      width: 100%;
      padding: 0.8rem;
      font-size: 1rem;
      background: #212e3c;
      border: 1px solid #2b3a4a;
      border-radius: 0.8rem;
      color: #fff;
      margin: 0.5rem 0;
      outline: none;
      font-family: inherit;
    }
    .btn {
      background: #2b5278;
      color: #fff;
      border: none;
      padding: 0.8rem 2rem;
      border-radius: 0.8rem;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 1rem;
      width: 100%;
    }
    .btn:hover { background: #3a6a99; }
    .btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    .btn-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .btn-spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn-skip {
      background: transparent;
      color: #8ea2b8;
      border: 1px solid #2b3a4a;
      margin-top: 0.5rem;
    }
    .error { color: #ff4d4d; margin-top: 1rem; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🔒 Set Password</h2>
    <p>You can set a password for faster login (optional)</p>
    <input type="password" id="passwordInput" placeholder="Password (min 6 characters)">
    <input type="password" id="confirmPasswordInput" placeholder="Confirm password">
    <button class="btn" id="submitPasswordBtn" onclick="submitPassword()">Save & Continue</button>
    <button class="btn btn-skip" onclick="skipPassword()">I'll set it up later</button>
    <div id="msg" class="error"></div>
  </div>

  <script>
    async function submitPassword() {
      const pwd = document.getElementById('passwordInput').value;
      const confirm = document.getElementById('confirmPasswordInput').value;
      if (pwd.length < 6) {
        document.getElementById('msg').textContent = 'Password must be at least 6 characters.';
        return;
      }
      if (pwd !== confirm) {
        document.getElementById('msg').textContent = 'Passwords do not match.';
        return;
      }

      const btn = document.getElementById('submitPasswordBtn');
      const originalText = 'Save & Continue';
      btn.disabled = true;
      btn.classList.add('btn-loading');
      btn.innerHTML = '<span class="btn-spinner"></span> Saving...';
      document.getElementById('msg').textContent = '';

      try {
        const resp = await fetch('/api/set_password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pwd })
        });
        const data = await resp.json();
        if (data.success) {
          window.location.href = '/chat';
        } else {
          document.getElementById('msg').textContent = data.error || 'Error saving password.';
          btn.disabled = false;
          btn.classList.remove('btn-loading');
          btn.textContent = originalText;
        }
      } catch (err) {
        document.getElementById('msg').textContent = 'Network error.';
        btn.disabled = false;
        btn.classList.remove('btn-loading');
        btn.textContent = originalText;
      }
    }

    function skipPassword() {
      window.location.href = '/chat';
    }
  </script>
</body>
</html>
