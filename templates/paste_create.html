<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>New Paste · amirrrr</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/chat.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/paste.css') }}">
    <link href="{{ url_for('static', filename='assets/fonts/Vazirmatn/Vazirmatn-font-face.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='assets/favicon.svg') }}">
    <meta name="theme-color" content="#0f1724">
</head>
<body class="paste-page paste-editor">
    <div class="paste-header">
        <h1><i class="fa-solid fa-file-lines"></i> New Paste</h1>
        <div style="display:flex; align-items:center; gap:1rem;">
            <select name="expires" form="pasteForm" class="btn"
                    style="cursor:pointer; font-family:inherit; appearance:auto;
                        background: var(--paste-panel-bg); color: var(--paste-text);
                        border: 1px solid var(--paste-border); border-radius:0.5rem;
                        padding:0.5rem 1rem; font-size:0.85rem;">
                <option value="600">10 Minutes</option>
                <option value="3600" selected>1 Hour</option>
                <option value="21600">6 Hours</option>
                <option value="86400">1 Day</option>
                <option value="172800">2 Days</option>
                <option value="259200">3 Days</option>
            </select>
            <button class="btn primary" onclick="document.getElementById('pasteForm').submit()">
                <i class="fa-solid fa-check"></i> Create Paste
            </button>
        </div>
    </div>
    <form id="pasteForm" method="POST" action="{{ url_for('paste.paste_create') }}" style="display:flex; flex:1; overflow:hidden;">
        <div class="editor-container">
            <div class="editor-pane">
                <div class="pane-header">
                    <i class="fa-solid fa-markdown"></i> Markdown
                </div>
                <textarea name="content" id="editor" placeholder="# Hello World
Type or paste your Markdown here...">{{ request.form.get('content', '') }}</textarea>
            </div>
            <div class="preview-pane">
                <div class="pane-header">
                    <i class="fa-solid fa-eye"></i> Preview
                </div>
                <div id="preview-content"></div>
            </div>
        </div>
    </form>

    <script src="{{ url_for('static', filename='js/marked.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/highlight.min.js') }}"></script>
    <script>
        const editor = document.getElementById('editor');
        const preview = document.getElementById('preview-content');

        marked.setOptions({
            breaks: true,
            gfm: true,
            tables: true,
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    return hljs.highlight(code, { language: lang }).value;
                }
                return hljs.highlightAuto(code).value;
            }
        });

        function updatePreview() {
            preview.innerHTML = marked.parse(editor.value);
            preview.querySelectorAll('p, li, h1, h2, h3, h4, h5, h6, blockquote')
                .forEach(el => el.setAttribute('dir', 'auto'));
            preview.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
        }

        editor.addEventListener('input', updatePreview);
        updatePreview();

        function setHighlightTheme() {
            const isLight = document.body.classList.contains('light-mode');
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.id = 'hljs-theme';
            link.href = isLight ?
                "{{ url_for('static', filename='css/github.min.css') }}" :
                "{{ url_for('static', filename='css/github-dark.min.css') }}";
            const old = document.getElementById('hljs-theme');
            if (old) old.remove();
            document.head.appendChild(link);
        }
        setHighlightTheme();
        new MutationObserver(setHighlightTheme).observe(document.body, {
            attributes: true,
            attributeFilter: ['class']
        });
    </script>
</body>
</html>
